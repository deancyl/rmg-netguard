name: Consistency

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Version and documentation consistency gate
        shell: bash
        run: |
          set -euo pipefail
          python verify_consistency.py

      - name: Build, zip and shell syntax
        shell: bash
        run: |
          set -euo pipefail
          python build_zip.py
          python verify_zip.py
          for f in module/scripts/*.sh module/*.sh; do sh -n "$f"; done

      - name: WebUI JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          sed -n '/<script>/,/<\/script>/p' module/webroot/index.html | sed '1d;$d' > /tmp/ng_ui.js
          node --check /tmp/ng_ui.js
